<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة | متجر حنان ستور</title>
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="3;url=/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Cairo', system-ui, sans-serif;
        background-color: #0c0a09;
        color: #f5f5f4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #1c1917;
        border: 1px solid #292524;
        border-radius: 20px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      }
      .badge {
        display: inline-block;
        background: rgba(217, 119, 6, 0.15);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.3);
        padding: 6px 16px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 20px;
      }
      h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; color: #fafaf9; }
      p { font-size: 15px; color: #a8a29e; line-height: 1.6; margin-bottom: 28px; }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #d97706, #b45309);
        color: #ffffff;
        text-decoration: none;
        padding: 12px 32px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        transition: transform 0.2s, opacity 0.2s;
      }
      .btn:hover { opacity: 0.9; transform: translateY(-1px); }
      .timer { margin-top: 18px; font-size: 13px; color: #78716c; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404 - صفحة تم تحديثها</div>
      <h1>الصفحة المطلوبة غير موجودة</h1>
      <p>تم تحديث صفحات وهيكل متجر حنان لتوفير أحدث المنتجات والمقالات الفاخرة. جاري تحويلك للصفحة الرئيسية تلقائياً...</p>
      <a href="/" class="btn">العودة إلى متجر حنان الآن</a>
      <div class="timer">سيتم التحويل التلقائي خلال ثوانٍ معدودة</div>
    </div>
  </body>
</html>
