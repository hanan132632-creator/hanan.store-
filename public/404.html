<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر حنان ستور | الصفحة غير موجودة</title>
  <meta http-equiv="refresh" content="2; url=/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAF8F5;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      color: #1c1917;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      margin: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .gold-badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #1c1917;
    }
    p {
      color: #78716c;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #1c1917;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #b45309;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="gold-badge">حنان ستور • Hanan Store</span>
    <h1>الصفحة المطلوبة غير متوفرة</h1>
    <p>يبدو أن الرابط المطلوب قد تم تحديثه أو نقله. يتم تحويلك تلقائياً إلى الصفحة الرئيسية لمتجر حنان ستور...</p>
    <a href="/" class="btn">الانتقال للرئيسية فوراً</a>
  </div>
  <script>
    setTimeout(function() {
      window.location.replace('/');
    }, 1500);
  </script>
</body>
</html>
