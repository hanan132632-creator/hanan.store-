<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير متوفرة | حنان ستور — Hanan Store</title>
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="3;url=/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        background-color: #FAF8F5;
        color: #1c1917;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 32px;
        box-shadow: 0 20px 40px -15px rgba(0,0,0,0.06);
        max-width: 540px;
        width: 100%;
        padding: 48px 32px;
        position: relative;
        overflow: hidden;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 20px;
      }
      .code {
        font-family: 'Playfair Display', serif;
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        color: #d97706;
        letter-spacing: -2px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #1c1917;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #78716c;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      .btn-primary {
        background: #1c1917;
        color: #fde68a;
        border: 1px solid rgba(245, 158, 11, 0.4);
        padding: 12px 32px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .btn-primary:hover {
        background: #000000;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 10px 20px -5px rgba(0,0,0,0.15);
      }
      .notice {
        font-size: 12px;
        color: #a8a29e;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <span>✨ متجر حنان الفاخر | Hanan Store</span>
      </div>
      <div class="code">404</div>
      <h1>الصفحة غير موجودة أو تم نقلها</h1>
      <p>
        نعتذر منك، يبدو أن الرابط الذي طلبته غير موجود أو تم تحديثه. سيتم نقلك تلقائياً إلى الصفحة الرئيسية لمتجر حنان خلال ثوانٍ.
      </p>
      <div class="actions">
        <a href="/" class="btn-primary">
          <span>الذهاب إلى الصفحة الرئيسية فوراً 🌸</span>
        </a>
      </div>
      <div class="notice">
        جارٍ التحويل التلقائي خلال <span id="sec">3</span> ثوانٍ...
      </div>
    </div>

    <script>
      let count = 3;
      const el = document.getElementById('sec');
      const timer = setInterval(() => {
        count--;
        if (el) el.textContent = count;
        if (count <= 0) {
          clearInterval(timer);
          window.location.replace('/');
        }
      }, 1000);
    </script>
  </body>
</html>
